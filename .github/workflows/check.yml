name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      - name: No JS in src
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:no-js

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run type-check

      - name: Arch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run arch

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:unit

      - name: Dead code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run scan:deadcode
